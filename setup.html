<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Store Setup</title>
  <link rel="stylesheet" href="setup.css" />
</head>
<body>
  <main class="setup-page">
    <div class="setup-box">
      <h1>Welcome</h1>
      <p>Set up your store without touching code.</p>

      <form id="setup-form">
        <label for="storeName">Store Name</label>
        <input type="text" id="storeName" required />

        <label for="supportEmail">Support Email</label>
        <input type="email" id="supportEmail" />

        <label for="phone">Phone</label>
        <input type="text" id="phone" />

        <label for="address">Address</label>
        <textarea id="address"></textarea>

        <label for="currency">Currency</label>
        <input type="text" id="currency" value="USD" />

        <label for="footerText">Footer Text</label>
        <textarea id="footerText"></textarea>

        <label for="facebook">Facebook</label>
        <input type="text" id="facebook" />

        <label for="instagram">Instagram</label>
        <input type="text" id="instagram" />

        <label for="tiktok">TikTok</label>
        <input type="text" id="tiktok" />

        <label for="twitter">X / Twitter</label>
        <input type="text" id="twitter" />

        <label for="whatsapp">WhatsApp</label>
        <input type="text" id="whatsapp" />

        <label for="heroTitle">Homepage Hero Title</label>
        <input type="text" id="heroTitle" />

        <label for="heroSubtitle">Homepage Hero Subtitle</label>
        <textarea id="heroSubtitle"></textarea>

        <label for="supportHeadline">Support Headline</label>
        <input type="text" id="supportHeadline" />

        <label for="supportText">Support Text</label>
        <textarea id="supportText"></textarea>

        <label for="homepageSupportEmail">Homepage Support Email</label>
        <input type="email" id="homepageSupportEmail" />

        <label for="supportInstagram">Homepage Instagram URL</label>
        <input type="text" id="supportInstagram" />

        <label for="supportTwitter">Homepage X / Twitter URL</label>
        <input type="text" id="supportTwitter" />


        <label for="smtpUser">Email (Gmail)</label>
        <input type="email" id="smtpUser" placeholder="yourstore@gmail.com" />

        <label for="smtpPass">Gmail App Password</label>
        <input type="password" id="smtpPass" placeholder="16-character app password" />
        <small style="color:#6b7280;font-size:12px;">
          Create one at: myaccount.google.com → Security → App Passwords
        </small>

        <label for="smtpFrom">Sender Name (optional)</label>
        <input type="text" id="smtpFrom" placeholder="My Store &lt;yourstore@gmail.com&gt;" />

        <label for="cloudinaryCloudName">Cloudinary Cloud Name</label>
        <input type="text" id="cloudinaryCloudName" placeholder="your-cloud-name" />

        <label for="cloudinaryApiKey">Cloudinary API Key</label>
        <input type="text" id="cloudinaryApiKey" placeholder="123456789012345" />

        <label for="cloudinaryApiSecret">Cloudinary API Secret</label>
        <input type="password" id="cloudinaryApiSecret" placeholder="Your Cloudinary API Secret" />
        <small style="color:#6b7280;font-size:12px;">
          Find all three at: cloudinary.com/console
        </small>

        <p id="setup-message"></p>
        <button type="submit" id="setup-btn">Save and Continue</button>
      </form>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="setup.js"></script>

</html>
