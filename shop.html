<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — Clothing Store</title>
  <meta name="robots" content="noindex" />

  <link rel="stylesheet" href="header.css" />
  <link rel="stylesheet" href="shop.css" />
  <link rel="icon" href="1.JPG" type="image/jpeg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/d55f670ce3.js" crossorigin="anonymous"></script>
</head>

<body>
  <!-- Shared header injected by header.js -->
  <div id="header"></div>

  <main class="shop-main">

    <!-- Top bar -->
    <div class="shop-topbar">
      <div class="shop-topbar-inner">
        <div class="topbar-left">
          <button type="button" id="toggle-filters" class="filter-toggle-btn">
            <i class="fa-solid fa-sliders"></i> Filters
          </button>
          <span class="result-count title">Products</span>
        </div>
        <div class="topbar-right">
          <label for="filter-sort" class="sr-only">Sort by</label>
          <select id="filter-sort" class="shop-select">
            <option value="newest">Newest</option>
            <option value="price-low">Price: Low → High</option>
            <option value="price-high">Price: High → Low</option>
            <option value="name-asc">Name A → Z</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Layout -->
    <div class="shop-layout">

      <!-- Sidebar -->
      <aside id="filters" class="shop-sidebar" aria-label="Product filters">

        <div class="sidebar-header">
          <span class="sidebar-title">Filter</span>
          <button type="button" id="filter-clear" class="clear-btn">Clear all</button>
        </div>

        <div class="filter-group">
          <label for="filter-search" class="filter-label">Search</label>
          <div class="search-input-wrap">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="search" id="search-input" class="shop-input"
              placeholder="Search products…" autocomplete="off" />
          </div>
        </div>

        <div class="filter-divider"></div>

        <div class="filter-group">
          <label for="filter-audience" class="filter-label">For</label>
          <select id="filter-audience" class="shop-select full">
            <option value="">Everyone</option>
            <option value="men">Men</option>
            <option value="women">Women</option>
            <option value="kids">Kids</option>
            <option value="unisex">Unisex</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filter-department" class="filter-label">Department</label>
          <select id="filter-department" class="shop-select full">
            <option value="">All Departments</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filter-category" class="filter-label">Category</label>
          <select id="filter-category" class="shop-select full">
            <option value="">All Categories</option>
          </select>
        </div>

        <div class="filter-divider"></div>

        <div class="filter-group">
          <label class="filter-check-label">
            <input type="checkbox" id="filter-featured" />
            <span class="check-box"></span>
            Featured only
          </label>
        </div>

      </aside>

      <!-- Product grid -->
      <section class="shop-content">
        <div id="products" class="products-grid"></div>
        <div id="pagination" class="pagination"></div>
      </section>

    </div>
  </main>

  <footer class="shop-footer">
    <div class="shop-footer-inner">
      <p id="footer-text">© Clothing Store. All rights reserved.</p>
      <nav class="shop-footer-nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
      </nav>
      <div class="footer-socials">
        <a id="social-facebook"  href="#" style="display:none">Facebook</a>
        <a id="social-twitter"   href="#" style="display:none">X</a>
        <a id="social-instagram" href="#" style="display:none">Instagram</a>
        <a id="social-tiktok"    href="#" style="display:none">TikTok</a>
        <a id="social-whatsapp"  href="#" style="display:none">WhatsApp</a>
      </div>
    </div>
  </footer>

  <!-- Script loading order:
       1. config.js     — API_BASE, SERVER_BASE, shared utilities (must be first)
       2. api.js        — apiFetch, getStoreSettings (depends on config.js)
       3. header.js     — injects shared header, cart, auth (depends on config + api)
       4. onboarding.js — setup gate, fires on DOMContentLoaded
       5. filters.js    — filter state + taxonomy helpers
       6. shop.js       — page logic, depends on all of the above
  -->
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="header.js"></script>
  <script src="onboarding.js"></script>
  <script src="filters.js"></script>
  <script src="shop.js"></script>
  <script src="payment.js"></script>
  <div></div>
</body>
</html>
