<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Collection — Premium Storefront</title>
  
  <!-- Global Core Stylesheet -->
  <link rel="stylesheet" href="style.css">
  <!-- Refined Shop Architecture Stylesheet -->
  <link rel="stylesheet" href="shop.css">
  
  <!-- Font Integrations (Optional but recommended for premium typography) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ====== REUSE CORE GLOBAL HEADER ====== -->
  <header class="global-header">
    <div class="header-inner">
      <a href="index.html" class="brand-logo">THE ARCHIVE</a>
      
      <nav class="nav-menu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="shop.html" class="nav-link active">Shop</a>
        <a href="#" class="nav-link">Editorial</a>
      </nav>

      <div class="header-actions">
        <div class="cart-wrapper">
          <button class="icon-btn" aria-label="Open Shopping Cart">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
            <span class="cart-badge-count">0</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ====== MAIN LAYOUT WRAPPER ====== -->
  <div class="shop-layout-container">
    
    <!-- ====== ADVANCED FILTER SIDEBAR ====== -->
    <aside class="shop-sidebar">
      <div class="filter-group">
        <h3 class="filter-title">Categories</h3>
        <ul class="filter-links">
          <li><button class="filter-btn active" data-category="all">All Collection</button></li>
          <li><button class="filter-btn" data-category="new">New Arrivals</button></li>
          <li><button class="filter-btn" data-category="clothing">Clothing</button></li>
          <li><button class="filter-btn" data-category="accessories">Accessories</button></li>
        </ul>
      </div>

      <div class="filter-group">
        <h3 class="filter-title">Sort By</h3>
        <select id="sort-products" class="premium-select">
          <option value="default">Featured</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
        </select>
      </div>
    </aside>

    <!-- ====== PRODUCT GRID MAIN ====== -->
    <main class="products-column">
      <div class="products-meta">
        <span id="product-count-display">Showing all items</span>
      </div>
      
      <!-- Target block injected dynamically by shop.js -->
      <div id="products-grid" class="premium-products-grid"></div>
    </main>

  </div>

  <!-- ====== SLIDE-IN SHOPPING CART DRAWER (As fixed in header.js) ====== -->
  <div id="cart-modal" class="cart-drawer-overlay">
    <div class="cart-drawer-container">
      <div class="cart-drawer-header">
        <h2>Your Bag (<span class="cart-total-count">0</span>)</h2>
        <button id="cart-close" class="close-drawer-btn" aria-label="Close Cart">&times;</button>
      </div>
      
      <!-- Target container for active cart selections -->
      <div id="cart-items-container" class="cart-drawer-body">
        <!-- Empty State Fallback Example -->
        <p class="empty-cart-text">Your collection bag is empty.</p>
      </div>

      <div class="cart-drawer-footer">
        <div class="subtotal-row">
          <span>Subtotal</span>
          <span id="cart-subtotal-amount">$0.00</span>
        </div>
        <button class="checkout-primary-btn">Proceed To Checkout</button>
      </div>
    </div>
  </div>

  <!-- ====== SCRIPT ORCHESTRATION ====== -->
  <!-- Global script managing drawer triggers and shared components -->
  <script src="header.js"></script>
  <!-- Dedicated client logic injection for dynamic products filtering -->
  <script src="shop.js"></script>
    <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="onboarding.js"></script>
  <script src="filters.js"></script>
</body>
</html>
